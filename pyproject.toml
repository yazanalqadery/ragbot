[project]
name = "ragbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yazanalqadery", email = "yazanalqadery@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ragbot = "ragbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]   # E = style errors, F = real bugs, I = import sorting
